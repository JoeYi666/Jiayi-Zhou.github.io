<!-- Restore visitor's language preference before first paint (avoids flash) -->
<script>
  (function () {
    try {
      var q = new URLSearchParams(window.location.search).get('lang');
      var l = (q === 'zh' || q === 'en') ? q : localStorage.getItem('site-lang');
      if (l === 'zh' || l === 'en') {
        document.documentElement.setAttribute('data-lang', l);
        document.documentElement.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
      }
    } catch (e) {}
  })();
</script>

<!-- Restore visitor's theme preference before first paint (avoids flash) -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem('site-theme');
      var mode = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
      var effective = mode;
      if (mode === 'system') {
        effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var root = document.documentElement;
      root.classList.remove('light', 'dark');
      root.classList.add(effective);
      root.setAttribute('data-theme', mode);
    } catch (e) {
      document.documentElement.classList.add('light');
      document.documentElement.setAttribute('data-theme', 'system');
    }
  })();
</script>
