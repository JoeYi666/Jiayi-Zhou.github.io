        - heading "🔬 Research Experience" [level=1] [ref=e105]
        - paragraph [ref=e106]:
          - strong [ref=e107]: "Doctoral Dissertation: The Impact of USD Stablecoins on International Financial Markets"
          - text: —
          - emphasis [ref=e108]: Independent Researcher
          - emphasis [ref=e109]: Sep. 2023 – Present
        - list [ref=e110]:
          - listitem [ref=e111]:
            - text: Constructed the
            - strong [ref=e112]: Incremental-Stock-Flow-Consistent (ISFC)
            - text: analytical framework to model stablecoin issuers’ balance sheets, revealing their accounting isomorphism with commercial banks alongside institutional heterogeneity.
          - listitem [ref=e113]:
            - text: Applied
            - strong [ref=e114]: Random Forest, XGBoost, and SHAP
            - text: to identify key drivers of stablecoin issuance across macro, crypto-market, regulatory, and network-effect dimensions; developed
            - strong [ref=e115]: LSTM/GRU and Transformer
            - text: models for multi-scenario supply forecasting.
          - listitem [ref=e116]:
            - text: Employed
            - strong [ref=e117]: LP-IV with Elastic Net residual instruments
            - text: to identify causal effects of stablecoin reserve allocation on U.S. Treasury yields and commercial paper spreads; integrated
            - strong [ref=e118]: Diebold-Yilmaz spillover indices
            - text: and
            - strong [ref=e119]: TVP-VAR
            - text: to quantify time-varying volatility transmission to bond markets.
          - listitem [ref=e120]:
            - text: Designed
            - strong [ref=e121]: Difference-in-Differences (DiD), triple-difference, and synthetic control
            - text: strategies with
            - strong [ref=e122]: IV-2SLS
            - text: (on-chain activity and regulatory events as instruments) to estimate stablecoins’ impact on interbank lending, money market funds, and monetary policy rate pass-through.
          - listitem [ref=e123]:
            - text: Built
            - strong [ref=e124]: cross-border stablecoin flow networks
            - text: using on-chain data; applied
            - strong [ref=e125]: PageRank, Louvain community detection, and cascade failure simulations
            - text: to analyze digital dollarization dynamics and foreign exchange volatility spillovers.
          - listitem [ref=e126]:
            - text: Applied
            - strong [ref=e127]: Hansen (1999) panel threshold models
            - text: to test currency substitution effects across emerging and advanced economies; employed
            - strong [ref=e128]: RDD
            - text: for regulatory threshold identification and
            - strong [ref=e129]: event studies
            - text: on SVB-USDC depeg and GENIUS/CLARITY Act shocks.
          - listitem [ref=e130]:
            - text: "Data sources:"
            - strong [ref=e131]: Glassnode, DeFiLlama, TradingView
            - text: ; all empirical work implemented in
            - strong [ref=e132]: Python
