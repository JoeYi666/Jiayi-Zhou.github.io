# ============================================================================
# Research 页面内容 —— 中英双语单一数据源
# ============================================================================

intro:
  en: "My doctoral research studies USD stablecoins as a bridge between the crypto ecosystem and the traditional financial system. I use an Incremental-Stock-Flow-Consistent (ISFC) framework, causal-identification strategies, and machine-learning tools to examine how stablecoin issuance, reserve allocation, and redemption affect bond yields, exchange rates, equity markets, and regulatory spillovers."
  zh: "我的博士研究将美元稳定币视为连接加密生态与传统金融体系的桥梁。我运用增量—存量—流量一致（ISFC）框架、因果识别策略与机器学习工具，考察稳定币的发行、储备配置与赎回如何影响债券收益率、汇率、股票市场与监管溢出。"

projects:
  - id: isfc-framework
    title_en: "ISFC Framework and the Money View"
    title_zh: "ISFC 框架与货币视角"
    role_en: "Ph.D. Researcher"
    role_zh: "博士生研究"
    period: "Sep. 2023 – Present"
    period_zh: "2023 年 9 月至今"
    points:
      - en: >-
          Develop the Incremental-Stock-Flow-Consistent (ISFC) framework to model
          stablecoin issuers' balance sheets as dynamic, incremental systems.
        zh: >-
          构建增量—存量—流量一致（ISFC）框架，将稳定币发行方资产负债表建模为动态
          增量系统。
      - en: >-
          Clarify the accounting isomorphism between stablecoin platforms and
          fractional-reserve commercial banks, tracing the intellectual lineage
          to Perry Mehrling's Money View and post-Keynesian SFC models.
        zh: >-
          阐明稳定币平台与部分准备金商业银行之间的会计同构性，并追溯其思想渊源至
          Perry Mehrling 的货币视角与后凯恩斯主义 SFC 模型。
      - en: >-
          Provide a common accounting language for the empirical chapters on
          banking, bond, foreign-exchange, and equity markets.
        zh: >-
          为后续关于银行、债券、外汇与股票市场的实证章节提供统一的会计语言。

  - id: issuance-drivers
    title_en: "Drivers and Forecasting of Stablecoin Issuance"
    title_zh: "稳定币发行的驱动因素与预测"
    role_en: "Ph.D. Researcher"
    role_zh: "博士生研究"
    period: "2023 – 2026"
    period_zh: "2023—2026"
    points:
      - en: >-
          Use rolling LASSO and SHAP-enhanced deep forecasting to track how the
          drivers of USDT, USDC, and DAI issuance vary across horizons and market
          regimes.
        zh: >-
          采用滚动 LASSO 与 SHAP 增强深度预测方法，追踪 USDT、USDC 与 DAI 发行驱动
          因素如何随期限与市场机制变化。
      - en: >-
          Find that long-horizon issuance is anchored in Federal Reserve liquidity
          plumbing and short-term interest rates, while short-horizon issuance is
          dominated by autoregressive supply momentum and realized-cap flows.
        zh: >-
          发现长期发行锚定于美联储流动性管道与短期利率，短期发行则由自回归供给
          动量与已实现市值资金流主导。
      - en: >-
          Distinguish centralized fiat-backed, decentralized algorithmic, and
          hybrid stablecoin designs in the forecasting and attribution analysis.
        zh: >-
          在预测与归因分析中区分中心化法币抵押型、去中心化算法型与混合型稳定币设计。

  - id: bond-market
    title_en: "Stablecoin Impacts on Treasury and Bond Markets"
    title_zh: "稳定币对国债与债券市场的影响"
    role_en: "Ph.D. Researcher"
    role_zh: "博士生研究"
    period: "2024 – 2026"
    period_zh: "2024—2026"
    points:
      - en: >-
          Estimate the causal effect of stablecoin flows on the U.S. Treasury
          yield curve using local-projection IV with Elastic-Net crypto shocks as
          instruments.
        zh: >-
          采用局部投影—工具变量方法，以 Elastic-Net 加密冲击作为工具变量，估计稳定
          币资金流对美国国债收益率曲线的因果效应。
      - en: >-
          Identify structural stablecoin demand shocks with heteroskedasticity-based
          estimation, SVAR-IV, and max-share identification, and document
          state-dependent transmission.
        zh: >-
          通过异方差识别、SVAR-IV 与 max-share 识别方法识别结构性稳定币需求冲击，并
          记录状态依赖传导。
      - en: >-
          Quantify volatility spillovers, credit-spread effects, and systemic-risk
          scenarios using Diebold-Yilmaz connectedness measures and calibrated
          stress tests.
        zh: >-
          运用 Diebold-Yilmaz 连通性测度与校准压力测试，量化波动溢出、信用利差效应与
          系统性风险情景。

  - id: fx-markets
    title_en: "Stablecoins and Foreign-Exchange Markets"
    title_zh: "稳定币与外汇市场"
    role_en: "Ph.D. Researcher"
    role_zh: "博士生研究"
    period: "2024 – 2026"
    period_zh: "2024—2026"
    points:
      - en: >-
          Examine whether USD-pegged stablecoins affect daily exchange rates across
          27 economies, using country-by-country panel regressions and a crypto-shock
          IV design.
        zh: >-
          考察美元锚定稳定币是否影响 27 个经济体的日度汇率，采用逐国面板回归与加密
          冲击工具变量设计。
      - en: >-
          Find that circulation and trading volume are the main transmission
          channels, with significant effects concentrated in developed economies
          and high-crypto-adoption countries.
        zh: >-
          发现流通量与交易量是主要传导渠道，显著效应集中于发达经济体与高加密采用
          国家。
      - en: >-
          Study dynamic volatility spillovers with TVP-VAR and show that spillovers
          spike during crisis episodes such as Terra/LUNA and the SVB-USDC de-peg.
        zh: >-
          运用 TVP-VAR 研究动态波动溢出，发现 Terra/LUNA 崩盘与 SVB-USDC 脱锚等危机
          期间溢出显著上升。

  - id: equity-regulation
    title_en: "Regulation, Equity Markets, and Systemic Risk"
    title_zh: "监管、股票市场与系统性风险"
    role_en: "Ph.D. Researcher"
    role_zh: "博士生研究"
    period: "2024 – 2026"
    period_zh: "2024—2026"
    points:
      - en: >-
          Evaluate how the GENIUS Act and CLARITY Act milestones in 2025 affect
          crypto-concept stocks, banks, payment firms, and the broad market using
          event studies and DCC-GARCH.
        zh: >-
          运用事件研究与 DCC-GARCH 评估 2025 年 GENIUS 法案与 CLARITY 法案关键节点对
          加密概念股、银行、支付公司与大盘的影响。
      - en: >-
          Show that crypto-concept stocks underperform traditional financial stocks
          around pro-regulation news, while large banks earn positive abnormal
          returns around the Senate passage of the GENIUS Act.
        zh: >-
          发现在支持监管推进的消息前后加密概念股跑输传统金融股，而参议院全院通过
          GENIUS 法案前后大银行获得正异常收益。
      - en: >-
          Measure time-varying volatility spillovers and extreme tail-risk contagion
          between stablecoin markets and U.S. equities with TVP-VAR, CoVaR, and MES.
        zh: >-
          使用 TVP-VAR、CoVaR 与 MES 测度稳定币市场与美国股票之间的时变波动溢出与
          极端尾部风险传染。

  - id: published-work
    title_en: "Published and Peer-Reviewed Work"
    title_zh: "已发表与同行评审成果"
    role_en: "Co-author / Lead Author"
    role_zh: "合作作者 / 第一作者"
    period: "2022 – 2026"
    period_zh: "2022—2026"
    points:
      - en: >-
          Systematic bibliometric and topic-modeling review of 891 crypto financial
          risk publications and 1,980 risk events, identifying 19 research themes
          and an integrated risk framework.
        zh: >-
          对 891 篇加密金融风险文献与 1980 起风险事件进行系统文献计量与主题建模综述，
          识别 19 个研究主题并构建综合风险框架。
      - en: >-
          Cross-disciplinary analysis of non-content factors affecting scientific
          citation impact in mathematics, computer science, and management.
        zh: >-
          跨数学、计算机科学与管理学分析影响科学论文引用影响力的非内容因素。
      - en: >-
          Biophysical-economics and balance-sheet reframing of carbon emission
          rights, applied to China's national carbon market.
        zh: >-
          从生物物理经济学与资产负债表视角重构碳排放权价值，并应用于中国全国碳市场。
      - en: >-
          Analysis of China's crude oil and LNG import trends, external dependence,
          and post-pandemic energy-security implications from 2018 to 2022.
        zh: >-
          分析 2018—2022 年中国原油与 LNG 进口趋势、对外依存度及疫情后能源安全含义。

