  - id: zhou2022carbon
    year: 2022
    type_en: "Journal Article"
    type_zh: "期刊论文"
    title: "A Model for Calculating the Value of Carbon Emission Rights Based on the Ideas of Biophysical Economics"
    title_zh: "基于生物物理经济学思想的碳排放权价值测算模型研究"
    authors: "**Jiayi Zhou**, Jian-Feng Guo, et al."
    authors_zh: "**周家屹**，郭剑锋等"
    venue_en: "*Chinese Journal of Management Science*, 2022. (in Chinese)"
    venue_zh: "《中国管理科学》，2022。"
    description_en: >-
      This paper reframes carbon emission rights from a biophysical economics and
      accounting perspective: national emissions are treated as assets, the globally
      shared atmospheric capacity as liabilities, and domestic carbon sinks as equity.
      It derives a carbon-pricing accounting identity in which the carbon price equals
      the monetized value of environmental capacity divided by total emissions, and it
      explains how CBAM transforms the passive expansion of the global-common liability
      into an explicit monetary loss. Applied to China's national carbon market, the
      model shows that the current price reflects mainly the domestic cost of carbon
      sink production, while future price increases will be driven by the gradual
      explicit pricing of the global-common liability through tighter caps and
      international carbon mechanisms.
    description_zh: >-
      本文从生物物理经济学与会计学视角重构碳排放权：将本国实际排放量视为资产，全球共有
      大气容量视为负债，国内碳汇新增视为权益。文章推导了碳定价会计恒等式——碳价等于环境
      容量货币化价值除以总排放量，并解释 CBAM 如何将全球共有负债的被动扩张显性化为货币
      损失。应用于中国全国碳市场，模型表明当前碳价主要反映国内碳汇生产成本，而未来价格
      上行将由更严格的总量控制与国际碳机制逐步推动全球共有负债显性化所驱动。
    abstract_en: >-
      Drawing on biophysical economics, this study reframes carbon emission rights
      as balance-sheet items. National emissions are valued as assets, the globally
      shared atmospheric capacity as liabilities, and domestic carbon sinks as equity.
      We derive an accounting identity that links carbon price to the monetized value
      of environmental capacity and apply it to China's national carbon market. The
      model offers a new accounting lens for carbon pricing and emissions budgeting,
      and it clarifies that CBAM acts as a mechanism that makes the consumption of
      global-common environmental capacity visible as a monetary loss.
    abstract_zh: >-
      本文借鉴生物物理经济学思想，将碳排放权重构为资产负债表项目：本国排放量作为资产，
      全球共有大气容量作为负债，国内碳汇作为权益。我们推导了连接碳价与环境容量货币化价值
      的会计恒等式，并将其应用于中国全国碳市场。该模型为碳定价与排放预算提供了新的会计
      视角，并阐明 CBAM 本质上是一种将全球共有环境容量消费显性化为货币损失的机制。
    doi: "10.16381/j.cnki.issn1003-207x.2021.1684"
    pdf: "/files/papers/zhou2022carbon.pdf"
    github: "https://github.com/JoeYi666/Value-of-Carbon-Asset"
    bibtex: |
      @article{zhou2022carbon,
        title={A Model for Calculating the Value of Carbon Emission Rights Based on the Ideas of Biophysical Economics},
        author={Zhou, Jiayi and Guo, Jian-Feng and others},
        journal={Chinese Journal of Management Science},
        year={2022},
        publisher={Science Press},
        doi={10.16381/j.cnki.issn1003-207x.2021.1684},
        note={in Chinese}
      }

