  - id: isfc-application
    chapter: "ISFC Applications"
    chapter_zh: "ISFC 应用"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "From Money View to Stablecoin Markets: An ISFC Account of Issuance, Banking, Bond, FX, and Equity Linkages"
    title_zh: "从货币观到稳定币市场：稳定币发行及银行、债券、外汇与股票关联的 ISFC 分析"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper applies the ISFC framework to map how stablecoin issuance
      mechanisms propagate through the traditional financial system. It uses
      consistent balance-sheet accounting to trace the flows from stablecoin
      issuance to bank deposits, short-dated Treasury and commercial-paper
      holdings, foreign-exchange demand, and crypto-equity valuations. By
      distinguishing centralized fiat-backed, decentralized algorithmic, and
      hybrid issuance designs, the analysis shows why different stablecoin
      architectures create different balance-sheet multipliers and risk
      transmission channels across banking, bond, FX, and equity markets.
    description_zh: >-
      本文应用 ISFC 框架，刻画稳定币发行机制如何向传统金融体系传导。通过一致的资产
      负债表会计，追踪稳定币发行如何流向银行存款、短期国债与商业票据持仓、外汇需求以及
      加密股票估值。通过区分中心化法币抵押型、去中心化算法型与混合型发行设计，分析揭示
      不同稳定币架构为何会在银行、债券、外汇与股票市场产生不同的资产负债表乘数与风险
      传导渠道。
    abstract_en: >-
      This paper applies the Incremental Stock-Flow-Consistent (ISFC) framework
      to explain stablecoin issuance mechanisms and their relationships with
      banking, bond, foreign-exchange, and equity markets. Using consistent
      balance-sheet accounting, we trace how issuance, reserve allocation, and
      redemption flows connect stablecoin platforms to traditional financial
      institutions and asset prices. We compare centralized fiat-backed,
      decentralized algorithmic, and hybrid designs, and show how each architecture
      generates distinct balance-sheet multipliers and risk transmission channels.
      The framework unifies the empirical chapters of the dissertation by
      providing a common accounting language for issuance-driven macro-financial
      linkages.
    abstract_zh: >-
      本文应用增量存量流量一致（ISFC）框架解释稳定币发行机制及其与银行、债券、外汇和
      股票市场的关系。通过一致的资产负债表会计，我们追踪发行、储备配置与赎回流动如何
      将稳定币平台与传统金融机构及资产价格相联系。我们比较中心化法币抵押型、去中心化
      算法型与混合型设计，展示每种架构如何产生不同的资产负债表乘数与风险传导渠道。该
      框架为论文的实证章节提供统一的会计语言，以理解发行驱动的宏观金融关联。
