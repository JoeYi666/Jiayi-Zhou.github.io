        journal={Working Paper},
        year={2026}
      }

  - id: wp-ch5-2
    chapter: "FX Markets"
    chapter_zh: "外汇市场"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Volatility Spillovers Between Stablecoins and Foreign Exchange Markets: A Dynamic Analysis with TVP-VAR"
    title_zh: "稳定币与外汇市场之间的波动溢出：基于 TVP-VAR 的动态分析"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper examines the dynamic volatility spillovers between major USD-pegged
      stablecoins (USDT, USDC, and DAI) and the foreign-exchange markets of 27 economies
      from January 2020 to December 2025. I estimate GARCH(1,1) conditional
      volatilities and apply the Diebold-Yilmaz spillover index together with a
      time-varying parameter VAR estimated by Kalman filtering. In normal times,
      stablecoin price volatility is largely idiosyncratic, but spillovers spike
      during the Terra/LUNA collapse and the SVB-induced USDC de-peg, when stablecoins
      flip from net receivers to large net transmitters of volatility. Emerging-market
      currencies are relatively more exposed to stablecoin volatility than developed
      market currencies.
    description_zh: >-
      本文考察 2020 年 1 月至 2025 年 12 月期间主要美元锚定稳定币（USDT、USDC、DAI）与 27
      个经济体外币市场之间的动态波动溢出。我估计 GARCH(1,1) 条件波动率，并应用
      Diebold-Yilmaz 溢出指数与基于 Kalman 滤波的时变参数 VAR。常态时期稳定币价格波动在
      很大程度上是特质性的，但在 Terra/LUNA 崩盘与硅谷银行引发的 USDC 脱锚期间溢出急剧
      上升，稳定币由波动率的净接收者转变为大规模净输出者。新兴市场货币相较发达经济体货币
      更容易暴露于稳定币波动。
    abstract_en: >-
      This paper examines the dynamic volatility spillovers between major USD-pegged
      stablecoins (USDT, USDC, and DAI) and the foreign exchange markets of 27 economies
      from January 2020 to December 2025. We estimate GARCH(1,1) conditional
      volatilities for all series and apply the Diebold-Yilmaz spillover index
      framework based on generalized forecast error variance decompositions, together
      with a time-varying parameter vector autoregression (TVP-VAR) estimated by Kalman
      filtering with forgetting factors. In normal times stablecoin price volatility
      is largely idiosyncratic, but spillovers spike during crisis episodes, when
      stablecoins flip from net receivers to large net transmitters of volatility.
      Emerging market currencies are relatively more exposed to stablecoin volatility.
    abstract_zh: >-
      本文考察 2020 年 1 月至 2025 年 12 月期间主要美元锚定稳定币（USDT、USDC、DAI）与 27
      个经济体外币市场之间的动态波动溢出。我们对所有序列估计 GARCH(1,1) 条件波动率，并
      基于广义预测误差方差分解应用 Diebold-Yilmaz 溢出指数框架，同时采用带遗忘因子的
      Kalman 滤波估计时变参数向量自回归（TVP-VAR）模型。常态时期稳定币价格波动很大程度上
      是特质性的，但在危机时段稳定币由净接收者转变为大规模净输出者，溢出急剧上升。新兴
      市场货币相对更容易暴露于稳定币波动。
