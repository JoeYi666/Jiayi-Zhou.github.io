        title={Unraveling Temporal and Structural Drivers of Stablecoin Issuance: A SHAP-Enhanced Deep Forecasting Framework},
        author={Zhou, Jiayi},
        journal={Working Paper},
        year={2026}
      }

  - id: wp-ch5-1
    chapter: "FX Markets"
    chapter_zh: "外汇市场"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Disentangling the Effects of Stablecoins on Exchange Rates: A Currency-by-Currency Analysis"
    title_zh: "区分稳定币对汇率的影响：逐币种分析"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper examines whether USD-pegged stablecoins affect exchange rates
      across 27 economies at daily frequency from January 2020 to December 2025.
      Combining on-chain stablecoin metrics with a multi-source panel of daily
      exchange rates and annual country characteristics, I estimate country-by-country
      panel regressions, standardized interaction terms, and a crypto-shock
      instrumental-variable design that exploits the Terra/LUNA collapse, the
      SVB-induced USDC de-peg, and lagged Ethereum network congestion. The average
      effects are small, but USDT coefficients are statistically significant in
      developed economies and high-crypto-adoption countries, with circulation and
      trading volume dominating issuance and active wallets as transmission channels.
    description_zh: >-
      本文考察 2020 年 1 月至 2025 年 12 月期间美元锚定稳定币是否影响 27 个经济体的日度
      汇率。我将链上稳定币指标与多来源的日度汇率及年度国家特征面板相结合，估计逐国面板
      回归、标准化交互项以及利用 Terra/LUNA 崩盘、硅谷银行引发的 USDC 脱锚与滞后以太坊网络
      拥堵构建的加密冲击工具变量。平均效应较小，但 USDT 系数在发达经济体与高加密采用国家
      统计显著，流通量与交易量是主导传导渠道，发行量与活跃钱包次之。
    abstract_en: >-
      We examine whether USD-pegged stablecoins (USDT, USDC, DAI) affect exchange
      rates across 27 economies at daily frequency from January 2020 to December
      2025. Combining on-chain stablecoin metrics (circulation, issuance, transfer
      volume, and active addresses) with a multi-source panel of daily exchange
      rates and annual country characteristics, we estimate country-by-country panel
      regressions, standardized country-characteristic interactions, and a crypto-
      shock instrumental-variables design. Average effects are small: USDT
      coefficients are significant in developed economies and high-crypto-adoption
      countries, but not in emerging markets. Circulation and trading volume dominate
      issuance and active wallets as transmission channels.
    abstract_zh: >-
      本文考察美元锚定稳定币（USDT、USDC、DAI）是否影响 2020 年 1 月至 2025 年 12 月期间
      27 个经济体的日度汇率。我们将链上稳定币指标（流通量、发行量、转账交易量、活跃地址数）
      与多来源的日度汇率和年度国家特征面板相结合，估计逐国面板回归、标准化国家特征交互项
      以及加密冲击工具变量设计。平均效应很小：USDT 系数在发达经济体和高加密采用国家显著，
      而在新兴市场并不显著。流通量与交易量是主导传导渠道，发行量与活跃钱包次之。
