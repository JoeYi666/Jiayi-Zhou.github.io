  - id: wp-ch4-4
    chapter: "Treasury/Bond Market"
    chapter_zh: "国债/债券市场"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Unraveling Temporal and Structural Drivers of Stablecoin Issuance: A SHAP-Enhanced Deep Forecasting Framework"
    title_zh: "解构稳定币发行量的时变与结构性驱动因素：基于 SHAP 增强的深度预测框架"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper proposes a SHAP-enhanced deep forecasting framework for stablecoin
      issuance that addresses three challenges: high-dimensional noise, the black-box
      nature of deep learning, and the structural differences between centralized
      collateralized and decentralized algorithmic stablecoins. Using daily data on
      USDT, USDC, and DAI over 2020–2026 within a nested walk-forward validation
      design, I show that a horizon-pooled non-negative least-squares ensemble
      beats the no-drift random walk on RMSE, MAE, and directional accuracy at all
      four horizons. A two-dimensional attribution framework across time horizons
      and stablecoin types reveals that short-horizon issuance is dominated by
      autoregressive supply momentum and realized-cap flows, while long-horizon
      issuance is anchored in Fed liquidity plumbing and short-term interest rates.
    description_zh: >-
      本文提出面向稳定币发行量预测的 SHAP 增强深度预测框架，应对三大挑战：高维噪声、
      深度学习的黑箱性质以及中心化抵押型与去中心化算法型稳定币之间的结构性差异。基于
      2020—2026 年 USDT、USDC 与 DAI 的日度数据，并在嵌套前向交叉验证设计下，我证明期限
      池化的非负最小二乘集成在全部四个期限上同时在 RMSE、MAE 与方向准确性上超越无漂移
      随机游走。跨期限与稳定币类型的二维归因框架揭示，短期发行由自回归供给动量与已实现
      市值资金流主导，长期发行则锚定于美联储流动性管道与短期利率。
    abstract_en: >-
      Stablecoins serve as the bridge between the crypto ecosystem and the
      traditional financial system, and their aggregate issuance is widely viewed
      as a key barometer of crypto-market liquidity and risk appetite. Forecasting
      stablecoin issuance, however, faces three challenges: the high-dimensional
      noise induced by a large array of on-chain, macro-financial, and sentiment
      variables; the black-box nature of deep learning models; and the neglect of
      structural differences between centralized collateralized and decentralized
      algorithmic stablecoins. We propose a SHAP-enhanced deep forecasting framework
      disciplined end-to-end by a nested walk-forward validation design. Using daily
      data on USDT, USDC, and DAI over 2020–2026, we show that the random walk can
      be beaten once forecasts are anchored, combined, and disciplined, and we
      construct a two-dimensional attribution framework across horizons and stablecoin
      types to map driver heterogeneity.
    abstract_zh: >-
      稳定币是加密生态与传统金融体系之间的桥梁，其总发行量被广泛视为加密市场流动性与
      风险偏好的关键晴雨表。然而，稳定币发行量预测面临三大挑战：链上、宏观金融与情绪变量
      众多所引致的高维噪声；深度学习模型的黑箱性质限制其经济可解释性；以及现有研究对中心化
      抵押型与去中心化算法型稳定币之间结构性差异的忽视。本文提出 SHAP 增强深度预测框架，
      并以嵌套前向交叉验证设计严格约束。基于 2020—2026 年 USDT、USDC 与 DAI 的日度数据，
      我们证明随机游走可以通过锚定、组合与约束被击败，并构建跨期限与稳定币类型的二维归因
      框架以刻画驱动因素异质性。
