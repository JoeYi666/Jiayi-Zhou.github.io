  - id: zhou2025ranking-wp
    chapter: "Bibliometrics"
    chapter_zh: "文献计量"
    year: 2025
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Ranking Influential Non-Content Factors on Scientific Papers' Citation Impact: A Multidomain Comparative Analysis"
    title_zh: "科学论文引用影响力的非内容因素排名：一项跨领域比较分析"
    authors: "Jiannan Zhu, **Jiayi Zhou**, Jing Pan, Feng Gu, & Jian-Feng Guo*"
    authors_zh: "朱剑楠，**周家屹**，潘静，顾锋，郭剑锋*"
    venue_en: "*Big Data and Cognitive Computing*, 9(2), 30, 2025."
    venue_zh: "《Big Data and Cognitive Computing》，9(2)，30，2025。"
    description_en: >-
      Compares non-content drivers of citation impact across mathematics,
      computer science, and management. Using XGBoost, GBDT, Random Forest, and
      quantile regression, the study finds that author reputation and reference
      count dominate citation influence, with discipline-specific variation in
      the relative importance of other factors.
    description_zh: >-
      跨数学、计算机科学与管理学三领域比较论文引用的非内容因素。使用 XGBoost、
      GBDT、随机森林与分位数回归，发现作者声望与参考文献数量主导引用影响，
      其他因素的相对重要性因学科而异。
    abstract_en: >-
      This paper investigates the non-content factors that shape scientific
      papers' citation impact across three disciplines. By combining machine
      learning and quantile regression, we rank the influence of author
      reputation, journal metrics, reference count, and collaboration patterns.
      The results highlight that author prominence and the breadth of references
      consistently rank highest, while the contribution of other factors varies
      by field. These findings provide practical guidance for researchers aiming
      to maximize the visibility of their work without sacrificing scholarly
      quality.
    abstract_zh: >-
      本文研究影响科学论文引用影响力的非内容因素，覆盖三个学科。通过机器学习
      与分位数回归相结合，我们对作者声望、期刊指标、参考文献数量与合作模式的
      影响进行排名。结果表明，作者知名度与参考文献广度始终最为重要，其他因素
      的贡献则因领域而异。研究为研究人员在不牺牲学术质量的前提下提升论文可见度
      提供了实践参考。
    doi: "10.3390/bdcc9020030"
    pdf: "/files/papers/zhou2025ranking.pdf"
    github: ""
    bibtex: |
      @article{zhou2025ranking,
        title={Ranking Influential Non-Content Factors on Scientific Papers' Citation Impact: A Multidomain Comparative Analysis},
        author={Zhu, Jiannan and Zhou, Jiayi and Pan, Jing and Gu, Feng and Guo, Jian-Feng},
        journal={Big Data and Cognitive Computing},
        volume={9},
        number={2},
        pages={30},
        year={2025},
        publisher={MDPI},
        doi={10.3390/bdcc9020030}
      }

