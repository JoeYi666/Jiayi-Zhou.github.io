      链上转账与交易所流量指标、加密衍生品情绪指标以及 FRED 债券市场变量的日度数据，本文
      构造 5 日稳定币流量，并以加密市场宽基收益率对传统金融变量做 Elastic Net 拟合所得残差
      作为工具变量。SHAP 值分解哪些传统金融变量吸收了加密收益率的可预测成分。10 亿美元的
      5 日稳定币净流入在 30 个交易日内使 1 个月期国债收益率最多下行 8.5 个基点，效应具有强
      非对称性，并在加密熊市中放大约十倍。
