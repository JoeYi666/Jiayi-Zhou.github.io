  - id: wp-ch6-2
    chapter: "Equity & Regulation"
    chapter_zh: "股票与监管"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Time-Varying Volatility Spillovers and Extreme Risk Contagion Between Stablecoin Markets and Stock Markets: Evidence from TVP-VAR and CoVaR Approaches"
    title_zh: "稳定币市场与股票市场之间的时变波动溢出与极端风险传染：来自 TVP-VAR 与 CoVaR 方法的证据"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper investigates the time-varying volatility spillovers and extreme
      risk contagion effects between stablecoin markets and U.S. stock markets from
      April 2021 to June 2026. I employ a TVP-VAR connectedness approach, frequency-
      domain decomposition, and CoVaR/MES tail-risk measures. Stablecoin markets are
      materially connected to traditional financial markets, with a full-sample
      average total spillover index of 47.2%. The largest spillover spike (87.5%)
      occurs during the March 2023 SVB failure and associated USDC de-peg, while
      crypto-native crises such as Terra-LUNA and FTX generate only moderate
      increases. Crypto-concept stocks and exchange stocks exhibit far larger tail
      exposures than payment stocks, the broad market, and bank stocks.
    description_zh: >-
      本文研究 2021 年 4 月至 2026 年 6 月期间稳定币市场与美国股票市场之间的时变波动溢出
      与极端风险传染效应。我采用 TVP-VAR 关联性方法、频域分解以及 CoVaR/MES 尾部风险测度。
      稳定币市场与传统金融市场存在实质性关联，全样本平均总溢出指数为 47.2%。最大的一次
      溢出飙升（87.5%）出现在 2023 年 3 月硅谷银行倒闭及 USDC 脱锚期间，而 Terra-LUNA 与
      FTX 等加密原生危机仅产生温和上升。加密货币概念股与交易所股的尾部暴露远大于支付股、
      大盘与银行股。
    abstract_en: >-
      This paper investigates the time-varying volatility spillovers and extreme
      risk contagion effects between stablecoin markets and U.S. stock markets from
      April 2021 to June 2026. Using the time-varying parameter vector autoregression
      (TVP-VAR) connectedness approach, we first construct a dynamic spillover index
      framework that overcomes the rolling-window bias in traditional Diebold-Yilmaz
      spillover measures. We further decompose spillovers into frequency domains and
      quantify extreme tail risk contagion via CoVaR and MES measures. Stablecoin
      markets are materially connected to traditional financial markets, with the
      largest spillover spike occurring during the March 2023 SVB failure and the
      associated USDC depegging. Crypto-concept stocks exhibit far larger tail
      exposures than payment stocks, the broad market, and bank stocks.
    abstract_zh: >-
      本文研究 2021 年 4 月至 2026 年 6 月期间稳定币市场与美国股票市场之间的时变波动溢出
      与极端风险传染效应。我们利用时变参数向量自回归（TVP-VAR）关联性方法，首先构建动态
      溢出指数框架以克服传统 Diebold-Yilmaz 溢出测度中的滚动窗口偏差；进一步对溢出进行
      频域分解，并通过 CoVaR 与 MES 测度量化极端尾部风险传染。稳定币市场与传统金融市场
      存在实质性关联，最大的一次溢出飙升出现在 2023 年 3 月硅谷银行倒闭及 USDC 脱锚期间。
      加密货币概念股的尾部暴露远大于支付股、大盘与银行股。
    doi: ""
    pdf: "/files/papers/6m2.pdf"
