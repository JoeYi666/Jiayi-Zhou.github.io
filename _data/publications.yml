      post-pandemic rise in import costs and its implications for national
      energy security.
    description_zh: >-
      分析中国原油与 LNG 进口趋势、对外依存度、2020 年进口峰值与 2022 年 LNG
      下降，梳理疫情后进口成本上升态势及其对能源安全的影响。
    abstract_en: >-
      This paper examines China's oil and gas trade between 2018 and 2022. We
      document the continued growth of crude oil imports, the rapid expansion
      and subsequent contraction of LNG imports, and the corresponding changes in
      external dependence. The analysis highlights the 2020 import peak, the
      2022 LNG decline, and the rising import costs in the post-pandemic period,
      offering implications for energy security and import diversification
      strategies.
    abstract_zh: >-
      本文考察 2018—2022 年中国油气贸易。我们记录了原油进口的持续增长、LNG
