  - id: zhou2023oilgas-wp
    chapter: "Energy Accounting"
    chapter_zh: "能源核算"
    year: 2023
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Analysis of China's Oil and Gas Imports and Exports from 2018 to 2022"
    title_zh: "2018—2022 年中国油气进出口状况分析"
    authors: "**Jiayi Zhou**, et al."
    authors_zh: "**周家屹**等"
    venue_en: "*International Petroleum Economics*, 2023. (in Chinese)"
    venue_zh: "《国际石油经济》，2023。"
    description_en: >-
      Provides a detailed accounting of China's crude oil and LNG import trends,
      external dependence, and post-pandemic import-cost dynamics. The paper
      documents the 2020 import peak and the 2022 LNG contraction, offering
      empirical evidence for national energy-security and import-diversification
      strategies.
    description_zh: >-
      详细核算中国原油与 LNG 进口趋势、对外依存度及疫情后进口成本动态。记录
      2020 年进口峰值与 2022 年 LNG 收缩，为国家能源安全与进口多元化策略提供
      经验证据。
    abstract_en: >-
      This paper examines China's oil and gas trade between 2018 and 2022. We
      document the continued growth of crude oil imports, the rapid expansion and
      subsequent contraction of LNG imports, and the corresponding changes in
      external dependence. The analysis highlights the 2020 import peak, the 2022
      LNG decline, and the rising import costs in the post-pandemic period,
      offering implications for energy security and import diversification
      strategies.
    abstract_zh: >-
      本文考察 2018—2022 年中国油气贸易。我们记录了原油进口的持续增长、LNG
      进口的快速扩张与随后的收缩，以及相应对外依存度的变化。分析突出 2020 年
      进口峰值、2022 年 LNG 下降及疫情后进口成本上升，为能源安全与进口多元化
      策略提供参考。
    doi: ""
    pdf: "/files/papers/zhou2023oilgas.pdf"
    github: ""
    bibtex: |
