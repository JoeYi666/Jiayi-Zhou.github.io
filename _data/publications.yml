    venue_en: "Open research note, 2026."
    venue_zh: "开放研究札记，2026。"
    description_en: >-
      An open research note that explains the balance-sheet logic behind the
      carbon emission rights valuation model. It reframes carbon emissions as
      sovereign assets, atmospheric capacity as liabilities, and domestic carbon
      sinks as equity, deriving a carbon-pricing accounting identity. This note
      is part of our commitment to open, reproducible research.
    description_zh: >-
      一篇开放研究札记，阐释《基于生物物理经济学思想的碳排放权价值测算模型
      研究》背后的资产负债表逻辑。将碳排放重构为国家资产、大气容量为负债、
      国内碳汇为权益，推导碳定价会计恒等式。本文是我们践行开放、可复现研究的
      一部分。
    abstract_en: >-
      This note develops a balance-sheet framework for carbon emission rights.
      National emissions are treated as assets, the globally shared atmospheric
      capacity as liabilities, and domestic carbon sinks as equity. We derive a
      carbon-pricing identity and apply it to China's national carbon market and
      the global carbon budget. The framework clarifies that carbon markets are
      fundamentally mechanisms for monetizing the allocation of environmental
      capacity, with important implications for climate policy and international
      carbon negotiations.
    abstract_zh: >-
      本文构建碳排放权的资产负债表框架。本国排放量视为资产，全球共有大气容量
      视为负债，国内碳汇视为权益。我们推导碳定价恒等式，并将其应用于中国全国
      碳市场与全球碳预算。该框架阐明，碳市场本质上是环境容量分配货币化的机制，
      对气候政策与国际碳谈判具有重要启示。
