working_papers:
  - id: ssrn-7225798
    chapter: "Chapter 1"
    chapter_zh: "第1章"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "A Systematic Bibliometric and Topic Modelling Review of Crypto Financial Risk Research"
    title_zh: "加密金融风险研究的系统文献计量与主题建模综述"
    authors: "**Jiayi Zhou**, Jingjing Li, Binbin Xu, Yanran Ma, & Jianfeng Guo"
    authors_zh: "**周家屹**，李晶晶，徐彬彬，马嫣然，郭剑锋"
    venue_en: "SSRN Working Paper, January 31, 2026."
    venue_zh: "SSRN 工作论文，2026 年 1 月 31 日。"
    description_en: >-
      This is the bibliometric backbone of the dissertation. We systematically
      review 891 crypto financial risk papers and 1,980 hand-collected risk
      events (2012–2025) using BERTopic and citation-network analysis. The
      paper builds an integrated risk-research framework spanning risk sources,
      measurement, contagion, hedging, and governance, and bridges the gap
      between the literature and empirical reality.
    description_zh: >-
      本文是博士论文的文献计量基础。我们使用 BERTopic 与引文网络分析，系统
      回顾 891 篇加密金融风险文献与 1,980 起手工整理的风险事件（2012—2025），
      构建覆盖风险来源、测度、传染、对冲与治理的综合研究框架，弥合文献空白
      与经验现实之间的差距。
    abstract_en: >-
      This study conducts a systematic bibliometric review of crypto financial
      risk research, mapping its intellectual structure, keyword evolution, and
      emerging research fronts. Using a modular BERTopic pipeline, we identify
      core themes spanning risk identification, measurement, transmission,
      hedging, and governance. We further link topic clusters to a hand-collected
      database of 1,980 crypto risk events from 2012 to 2025, bridging the gap
      between the literature and empirical reality and proposing an end-to-end
      risk research framework.
    abstract_zh: >-
      本研究对加密金融风险研究进行系统文献计量综述，刻画其知识结构、关键词
      演进与新兴研究前沿。通过模块化 BERTopic 流程，我们识别覆盖风险识别、
      度量、传染、对冲与治理的核心主题，并将主题聚类与 2012—2025 年手工整理
      的 1,980 起加密风险事件数据库相联系，提出端到端的风险研究框架。
    doi: "10.2139/ssrn.7225798"
    pdf: ""
    github: ""
    bibtex: |
      @article{zhou2026crypto,
        title={A Systematic Bibliometric and Topic Modelling Review of Crypto Financial Risk Research},
        author={Zhou, Jiayi and Li, Jingjing and Xu, Binbin and Ma, Yanran and Guo, Jianfeng},
        journal={SSRN Working Paper},
        year={2026},
        doi={10.2139/ssrn.7225798}
      }

  - id: isfc-framework
    chapter: "Chapter 2"
    chapter_zh: "第2章"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "ISFC: An Incremental Stock-Flow-Consistent Framework for Stablecoin Balance Sheets"
    title_zh: "ISFC：面向稳定币资产负债表的增量存量流量一致框架"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      Develops the Incremental Stock-Flow-Consistent (ISFC) framework that
      models stablecoin issuers' balance sheets as dynamic, incremental systems.
      The framework clarifies the accounting isomorphism between stablecoin
      platforms and commercial banks while accommodating institutional
      heterogeneity, laying the theoretical foundation for the empirical
      chapters that follow.
    description_zh: >-
      构建增量存量流量一致（ISFC）框架，将稳定币发行方资产负债表建模为动态
      增量系统。该框架在兼容机构异质性的前提下，阐明稳定币平台与商业银行的
      会计同构性，为后续实证章节奠定理论基础。
    abstract_en: >-
      This paper develops an Incremental Stock-Flow-Consistent (ISFC) framework
      for analyzing stablecoin issuers' balance sheets. By treating stablecoin
      issuance, reserve flows, and redemptions as incremental stock-flow
      operations, the model reveals the accounting isomorphism between
      stablecoin platforms and fractional-reserve commercial banks. The
      framework accommodates heterogeneous reserve practices and provides a
      consistent accounting language for measuring price, network, and
      balance-sheet effects in subsequent empirical work.
    abstract_zh: >-
      本文构建面向稳定币发行方资产负债表的增量存量流量一致（ISFC）框架。
      通过将稳定币发行、储备流动与赎回视为增量存量流量操作，模型揭示稳定币
      平台与部分准备金商业银行之间的会计同构性。该框架兼容异质性储备实践，
      为后续实证工作衡量价格、网络与资产负债表效应提供一致的会计语言。
    doi: ""
    pdf: ""
    github: ""
    bibtex: |
      @article{zhou2026isfc,
        title={ISFC: An Incremental Stock-Flow-Consistent Framework for Stablecoin Balance Sheets},
        author={Zhou, Jiayi},
        journal={Working Paper},
        year={2026}
      }

