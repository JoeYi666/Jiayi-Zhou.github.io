working_papers:
  - id: isfc-framework
    chapter: "ISFC Framework"
    chapter_zh: "ISFC 框架"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "ISFC: An Incremental Stock-Flow-Consistent Framework for Stablecoin Balance Sheets"
    title_zh: "ISFC：面向稳定币资产负债表的增量存量流量一致框架"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper develops the Incremental Stock-Flow-Consistent (ISFC) framework
      that models stablecoin issuers' balance sheets as dynamic, incremental
      systems. It clarifies the accounting isomorphism between stablecoin
      platforms and fractional-reserve commercial banks, traces the intellectual
      lineage back to the money view and post-Keynesian SFC models, and shows how
      issuance, reserve flows, and redemptions can be represented as mutually
      consistent stock and flow adjustments. The framework accommodates issuer
      heterogeneity in reserve composition and redemption rules, providing the
      theoretical foundation for the empirical chapters on banking, bond, FX, and
      equity markets that follow.
    description_zh: >-
      本文构建增量存量流量一致（ISFC）框架，将稳定币发行方资产负债表建模为动态
      增量系统。该框架阐明稳定币平台与部分准备金商业银行之间的会计同构性，追溯其
      思想渊源至货币观与后凯恩斯主义 SFC 模型，并将发行、储备流动与赎回表示为相互
      一致的存量与流量调整。框架兼容发行方在储备构成与赎回规则上的异质性，为后续关于
      银行、债券、外汇与股票市场的实证章节奠定理论基础。
    abstract_en: >-
      This paper develops an Incremental Stock-Flow-Consistent (ISFC) framework
      for analyzing stablecoin issuers' balance sheets. By treating stablecoin
      issuance, reserve flows, and redemptions as incremental stock-flow
      operations, the model reveals the accounting isomorphism between stablecoin
      platforms and fractional-reserve commercial banks. The framework relates
      this isomorphism to the money view of banking and to post-Keynesian
      stock-flow-consistent models, accommodates heterogeneous reserve practices,
      and provides a consistent accounting language for measuring price, network,
      and balance-sheet effects in subsequent empirical work.
    abstract_zh: >-
      本文构建面向稳定币发行方资产负债表的增量存量流量一致（ISFC）框架。通过将
      稳定币发行、储备流动与赎回视为增量存量流量操作，模型揭示稳定币平台与部分准备金
      商业银行之间的会计同构性。框架将该同构性与银行货币观及后凯恩斯主义存量流量一致
      模型相联系，兼容异质性储备实践，并为后续实证工作衡量价格、网络与资产负债表效应
      提供一致的会计语言。
    doi: ""
    pdf: ""
    github: "https://github.com/JoeYi666/ISFC"
    bibtex: |
