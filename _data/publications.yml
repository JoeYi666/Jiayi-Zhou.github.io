  - id: wp-ch6-1
    chapter: "Equity & Regulation"
    chapter_zh: "股票与监管"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Regulatory Spillovers and Asset Pricing Implications of Stablecoin Legislation: Evidence from the GENIUS Act Event Study and DCC-GARCH Analysis"
    title_zh: "稳定币立法的监管溢出与资产定价含义：来自 GENIUS 法案事件研究与 DCC-GARCH 分析的证据"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper examines how stablecoin regulatory announcements affect U.S.
      financial and crypto-related equity markets. Focusing on eight key legislative
      milestones of the GENIUS Act and CLARITY Act in 2025, I combine event-study
      methodology, DCC-GARCH dynamic correlation analysis, and panel fixed-effects
      regressions. Crypto-concept stocks significantly underperform traditional
      financial stocks around pro-regulation news, while large banks earn positive
      abnormal returns around the Senate passage of the GENIUS Act. DCC-GARCH
      estimates show that dynamic conditional correlations between stablecoin market
      capitalization changes and equity returns increase significantly after
      regulatory clarification, indicating closer integration between stablecoin
      markets and traditional finance.
    description_zh: >-
      本文考察稳定币监管公告如何影响美国金融类与加密相关股票市场。围绕 2025 年 GENIUS
      法案与 CLARITY 法案的八个关键立法节点，我综合事件研究法、DCC-GARCH 动态相关分析与
      面板固定效应回归。支持监管推进的消息前后，加密概念股显著跑输传统金融股；而参议院
      全院通过 GENIUS 法案前后，大银行获得正异常收益。DCC-GARCH 估计显示，监管澄清后稳定
      币市值变动与股票收益之间的动态条件相关显著上升，表明稳定币市场与传统金融的融合加深。
    abstract_en: >-
      This paper examines how stablecoin regulatory announcements affect U.S.
      financial and crypto-related equity markets, using a multi-method approach that
      combines event study methodology, DCC-GARCH dynamic correlation analysis, and
      panel fixed-effects regressions. Focusing on eight key legislative milestones
      of the GENIUS Act and CLARITY Act in 2025, we document strong evidence of
      sectorally differentiated market reactions. Crypto-concept stocks significantly
      underperform traditional financial stocks around pro-regulation news, while
      large banks earn significant positive abnormal returns around the Senate
      passage of the GENIUS Act. DCC-GARCH estimates show that dynamic conditional
      correlations between stablecoin market capitalization changes and equity returns
      increase significantly after regulatory clarification for all sectors.
    abstract_zh: >-
      本文采用事件研究法、DCC-GARCH 动态相关分析与面板固定效应回归相结合的多方法框架，
      考察稳定币监管公告如何影响美国金融类与加密概念类股票市场。围绕 2025 年 GENIUS 法案
      与 CLARITY 法案的八个关键立法节点，我们发现了板块间高度差异化市场反应的强证据。在
      支持监管推进的消息前后，纯加密概念股显著跑输传统金融股；在参议院全院通过 GENIUS 法案
      前后，大银行获得显著为正的超额收益。DCC-GARCH 估计显示，监管澄清后所有板块的股票
      收益与稳定币市值变动之间的动态条件相关均显著上升。
