    title: "Stablecoin Flows and Treasury Yields: Interpretable Machine Learning Meets Causal Identification"
    title_zh: "稳定币资金流与国债收益率：可解释机器学习与计量因果识别的结合"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper combines Jorda (2005) local projections with a machine-learning-
      assisted instrumental variable to estimate the causal effect of dollar
      stablecoin flows on the U.S. Treasury yield curve. Using daily data on
      USDT, USDC, DAI, and BUSD over 2020–2026, I purge broad crypto-market
      returns of their predictable component from traditional finance variables
      using Elastic Net regularization and use the residual as an instrument.
      SHAP values make the first-stage machine-learning step transparent. A
      $1 bn five-day stablecoin inflow lowers the 1-month yield by up to 8.5 bps
      over 30 trading days, and the effect is strongly asymmetric and amplified
      roughly tenfold in crypto bear markets.
    description_zh: >-
      本文将 Jordà（2005）局部投影与机器学习辅助的工具变量相结合，估计美元稳定币
      资金流对美国国债收益率曲线的因果效应。基于 2020—2026 年 USDT、USDC、DAI 与 BUSD
      的日度数据，我用 Elastic Net 正则化剔除加密市场宽基收益率中可由传统金融变量预测
      的成分，并将残差作为工具变量。SHAP 值使机器学习第一阶段透明化。10 亿美元的 5 日稳定
      币净流入在 30 个交易日内使 1 个月期国债收益率最多下行 8.5 个基点，效应具有强非对称
      性，并在加密熊市中放大约十倍。
    abstract_en: >-
      We estimate the causal effect of dollar-stablecoin flows on the U.S. Treasury
      yield curve by combining Jorda (2005) local projections with a machine-
      learning-assisted instrumental variable. Using daily data on USDT, USDC, DAI,
      and BUSD supply, on-chain transfer and exchange-flow indicators, crypto
      derivatives sentiment, and FRED bond-market variables over 2020–2026, we
      construct the five-day stablecoin flow and instrument it with the Elastic-Net
      residual of broad crypto-market returns on traditional finance variables.
      SHAP values decompose which traditional finance variables absorb the
      predictable component of crypto returns. A $1 bn five-day net stablecoin
      inflow lowers the 1-month Treasury yield by up to 8.5 bps over 30 trading
      days, and the effect is strongly asymmetric and amplified roughly tenfold
      in crypto bear markets.
    abstract_zh: >-
      本文结合 Jordà（2005）局部投影与机器学习辅助的工具变量，估计美元稳定币资金流
