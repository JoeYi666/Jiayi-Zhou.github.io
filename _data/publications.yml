        author={Zhou, Jiayi},
        journal={Working Paper},
        year={2026}
      }

  - id: wp-ch3-1
    chapter: "Issuance Drivers"
    chapter_zh: "发行驱动"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Time-Varying Analysis of Stablecoin Issuance Drivers: A Rolling LASSO Approach"
    title_zh: "稳定币发行驱动因素的时变分析与轮动效应"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper investigates which macro-financial, crypto-market, and
      network-effect variables drive stablecoin issuance, and how their relative
      importance evolves over time. Using daily data on USDT, USDC, and DAI from
      2020 to 2026, I apply a rolling LASSO approach to track time-varying driver
      importance and detect regime shifts in issuance dynamics. The results reveal
      a clear rotation effect: stablecoin issuance is anchored in Fed liquidity
      plumbing and short-term interest rates over long horizons, while short-horizon
      issuance is dominated by autoregressive supply momentum and market-wide
      realized-cap flows. Decentralized stablecoins such as DAI depend more on
      coin-specific on-chain quantities than their centralized peers.
    description_zh: >-
      本文研究哪些宏观金融、加密市场与网络效应变量驱动稳定币发行，以及其相对重要性
      如何随时间演变。基于 2020—2026 年 USDT、USDC 与 DAI 的日度数据，我采用滚动
      LASSO 方法追踪驱动因素重要性的时变特征，识别发行动态中的机制切换。结果呈现清晰
      的轮动效应：长期发行锚定于美联储流动性管道与短期利率，而短期发行则由自回归供给
      动量与市场层面已实现市值资金流主导。去中心化稳定币 DAI 相较中心化同类更依赖币种
      特定的链上变量。
    abstract_en: >-
      Stablecoins serve as the bridge between the crypto ecosystem and the
      traditional financial system, and their aggregate issuance is widely viewed
      as a key barometer of crypto-market liquidity and risk appetite. This paper
      uses a rolling LASSO approach to analyze the time-varying drivers of
      stablecoin issuance for USDT, USDC, and DAI over 2020–2026. We find that
      driver importance rotates across horizons and market regimes: long-horizon
      issuance is anchored in Federal Reserve liquidity-plumbing variables and
      short-term interest rates, while short-horizon issuance is dominated by
      autoregressive supply momentum and market-wide realized-cap flows.
      Decentralized stablecoins exhibit distinct driver heterogeneity compared
      with centralized collateralized stablecoins.
    abstract_zh: >-
      稳定币是加密生态与传统金融体系之间的桥梁，其总发行量被广泛视为加密市场流动性与
      风险偏好的关键晴雨表。本文采用滚动 LASSO 方法分析 2020—2026 年 USDT、USDC 与
      DAI 发行驱动因素的时变特征。我们发现驱动因素的重要性会随期限与市场机制轮动：长期
      发行锚定于美联储流动性管道变量与短期利率，短期发行则由自回归供给动量与市场层面已
      实现市值资金流主导。去中心化稳定币相较中心化抵押型稳定币呈现出不同的驱动因素
      异质性。
    doi: ""
    pdf: "/files/papers/3m1.pdf"
    github: "https://github.com/JoeYi666/Chapter3_Regularized_Regression"
    bibtex: |
      @article{zhou2026ch3m1,
        title={Time-Varying Analysis of Stablecoin Issuance Drivers: A Rolling LASSO Approach},
        author={Zhou, Jiayi},
        journal={Working Paper},
        year={2026}
      }

  - id: wp-ch3-2
    chapter: "Issuance Drivers"
    chapter_zh: "发行驱动"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Stablecoin Flows and the U.S. Treasury Yield Curve: A Local Projection–IV Approach"
    title_zh: "稳定币资金流与美国国债收益率曲线：局部投影–工具变量方法"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper estimates the causal effect of dollar stablecoin flows on the
      U.S. Treasury yield curve using daily data from January 2021 to June 2026.
      I construct an Elastic-Net crypto shock as an instrumental variable for
      exogenous stablecoin flow variation and apply local-projection IV methods.
      A two-standard-deviation ($2.5 bn) stablecoin inflow lowers the 3-month
      T-bill yield by about 10 basis points within 10 days, with effects
      concentrated at the front end of the curve (1M, 3M) and fading beyond one
      year. Outflows are about twice as large as inflows, consistent with
      fire-sale asymmetry during redemptions, and USDT accounts for roughly 45%
      of the transmission.
    description_zh: >-
      本文利用 2021 年 1 月至 2026 年 6 月的日度数据，估计美元稳定币资金流对美国国债
      收益率曲线的因果效应。我构建 Elastic-Net 加密冲击作为稳定币资金流外生变异的工具
      变量，并应用局部投影–工具变量方法。两倍标准差（约 25 亿美元）的稳定币流入在 10 天
      内使 3 个月期国库券收益率下降约 10 个基点，效应集中于曲线前端（1 个月、3 个月），
      并在 1 年以上期限消失。流出效应约为流入的两倍，与赎回期间的抛售非对称性一致，
      USDT 贡献约 45% 的传导。
    abstract_en: >-
      We estimate the causal effect of dollar stablecoin flows on the U.S. Treasury
      yield curve using daily data from January 2021 to June 2026. Combining
      issuer-level circulating supply for USDT, USDC, DAI, and BUSD with FRED
      Treasury yields and a rich macro-financial control set, we construct a 5-day
      market-capitalization flow measure and identify exogenous variation through
      an Elastic-Net crypto shock: the cumulated residual of daily Bitcoin returns
      after partialling out contemporaneous traditional-finance variation. A
      two-standard-deviation ($2.5 bn) stablecoin inflow lowers the 3-month T-bill
      yield by about 10 basis points within 10 days. The effect is sharply
      concentrated at the front of the curve, outflows generate responses roughly
      twice as large as inflows, and issuer-level decompositions attribute about
      45% of the transmission to USDT.
    abstract_zh: >-
      本文利用 2021 年 1 月至 2026 年 6 月的日度数据，估计美元稳定币资金流对美国国债
      收益率曲线的因果效应。我们结合 USDT、USDC、DAI 与 BUSD 的发行人层面流通量数据、
      FRED 国债收益率以及丰富的宏观金融控制变量，构造 5 日市值流量测度，并通过
      Elastic-Net 加密冲击识别外生变异：即日度比特币收益率在剔除同期传统金融变量影响后
      的累积残差。两倍标准差（约 25 亿美元）的稳定币流入在 10 天内使 3 个月期国库券收益率
      下降约 10 个基点。效应高度集中于曲线前端，流出产生的响应约为流入的两倍，发行人层面
      分解将约 45% 的传导归因于 USDT。
    doi: ""
    pdf: "/files/papers/3m2.pdf"
    github: "https://github.com/JoeYi666/Chapter3_SHAP_FS"
    bibtex: |
      @article{zhou2026ch3m2,
        title={Stablecoin Flows and the U.S. Treasury Yield Curve: A Local Projection--IV Approach},
        author={Zhou, Jiayi},
        journal={Working Paper},
        year={2026}
      }

  - id: wp-ch4-1
    chapter: "Treasury/Bond Market"
    chapter_zh: "国债/债券市场"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Stablecoin Shocks, Spillovers and State-Dependent Transmission: Structural Identification and Time-Varying Propagation"
    title_zh: "稳定币冲击、溢出与状态依赖传导：结构识别与时变传播"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper identifies structural stablecoin demand shocks and traces their
      dynamic transmission to the U.S. Treasury market, the dollar, crypto assets,
      and equities. Using a manually curated event library of 16 stablecoin-ecosystem
      news items (2021–2025) and daily market-cap changes of USDT and USDC over
      2020–2026, I deploy three cross-validating identification strategies:
      heteroskedasticity-based estimation, SVAR-IV, and max-share identification.
      A 1% stablecoin demand shock lowers the 1-month Treasury yield by up to
      7.5–7.6 basis points at a trough near 26 weeks. Spillovers are approximately
      neutral on average but turn net-positive around crisis episodes, and the
      yield response is 1.3–2.6 times larger in post-2023 high-rate and
      post-regulation states.
    description_zh: >-
      本文识别结构性稳定币需求冲击，并追踪其对美国国债市场、美元、加密资产与股票的
      动态传导。基于人工整理的 2021—2025 年 16 个稳定币生态新闻事件库以及 2020—2026
      年 USDT 与 USDC 的日度市值变动数据，我采用三种相互交叉验证的识别策略：异方差识别、
      SVAR-IV 与 max-share 识别。1% 的稳定币需求冲击会在约 26 周处使 1 个月期国债收益率
      累计最多下行 7.5–7.6 个基点。稳定币溢出在全样本上近似中性，但在危机时段转为净输出，
      且 2023 年之后的高利率与后监管状态将收益率响应放大约 1.3–2.6 倍。
    abstract_en: >-
      We identify structural stablecoin demand shocks and trace their dynamic
      transmission to the U.S. Treasury market, the dollar, crypto assets, and
      equities, with particular attention to time variation and state dependence.
      Using a manually curated event library of 16 stablecoin-ecosystem news items
      (2021–2025) and daily market-cap changes of USDT and USDC over 2020–2026, we
      deploy three identification strategies that cross-validate each other:
      heteroskedasticity-based estimation applied to event versus control dates,
      a daily SVAR identified by an event-based external instrument (SVAR-IV), and
      max-share identification. A stablecoin demand shock that lifts combined
      USDT+USDC market cap by 1% lowers the 1-month Treasury yield by up to
      7.5–7.6 bps cumulatively at a trough near 26 weeks. Spillovers turn into a
      net transmitter around crisis episodes, and the yield response is 1.3–2.6
      times larger in post-2023 high-rate and post-regulation states.
    abstract_zh: >-
      本文识别结构性稳定币需求冲击，并追踪其对美国国债市场、美元、加密资产与股票市场
      的动态传导，重点关注传导的时变性与状态依赖性。基于人工整理的 2021—2025 年 16 个
      稳定币生态新闻事件库以及 2020—2026 年 USDT 与 USDC 的日度市值变动数据，本文采用
      三种相互交叉验证的识别策略：应用于事件日与对照日的异方差识别估计量、以事件日为
      外部工具变量的日度结构向量自回归（SVAR-IV）、以及选取最大化稳定币自身预测误差
      方差份额的结构冲击的 max-share 识别。使 USDT+USDC 合计市值上升 1% 的稳定币需求冲击
      会在约 26 周处使 1 个月期国债收益率累计最多下行 7.5–7.6 个基点。稳定币溢出在危机
      时段转为净输出，且在 2023 年之后的高利率与后监管状态下收益率响应放大约 1.3–2.6 倍。
    doi: ""
    pdf: "/files/papers/4m1.pdf"
    github: "https://github.com/JoeYi666/Chapter4_Impact_on_Bonds_Market"
    bibtex: |
      @article{zhou2026ch4m1,
        title={Stablecoin Shocks, Spillovers and State-Dependent Transmission: Structural Identification and Time-Varying Propagation},
        author={Zhou, Jiayi},
        journal={Working Paper},
        year={2026}
      }

  - id: wp-ch4-2
    chapter: "Treasury/Bond Market"
    chapter_zh: "国债/债券市场"
    year: 2026
    type_en: "Working Paper"
    type_zh: "工作论文"
    title: "Stablecoins and the Bond Market: Yield-Curve Effects, Volatility Spillovers, Credit Spreads and Systemic Risk"
    title_zh: "稳定币与债券市场：收益率曲线效应、波动溢出、信用利差与系统性风险"
    authors: "**Jiayi Zhou**"
    authors_zh: "**周家屹**"
    venue_en: "Working paper, 2026."
    venue_zh: "工作论文，2026。"
    description_en: >-
      This paper studies how stablecoin issuance and redemption affect the bond
      market along four dimensions: the Treasury yield curve, volatility
      spillovers, credit spreads as a proxy for the commercial-paper market, and
      systemic risk. Using daily data from 2020 to 2026, I combine LP, LP-IV,
      VAR, Diebold-Yilmaz connectedness measures, two-stage least squares with
      credit-spread proxies, event studies, Rigobon (2003) heteroskedasticity
      identification, and calibrated stress tests. A $1 bn five-day net issuance
      lowers 1M/3M Treasury yields by up to 3.4/2.4 basis points within three
      weeks, stablecoin-bond connectedness averages 19.7%, and a 10% USDT run
      would raise the 3-month yield by 47–60 basis points in calibrated stress
      scenarios.
    description_zh: >-
      本文从四个维度研究稳定币发行与赎回对债券市场的影响：国债收益率曲线、波动溢出、
      作为商业票据市场代理的信用利差以及系统性风险。基于 2020—2026 年的日度数据，我综合
      运用局部投影（LP）、LP-IV、向量自回归、Diebold-Yilmaz 连通性测度、基于信用利差代理
      的两阶段最小二乘、事件研究、Rigobon（2003）异方差识别与校准压力测试。10 亿美元的 5
      日净发行在三周内使 1 个月/3 个月期国债收益率最多下行 3.4/2.4 个基点，稳定币与债市的
      平均连通性为 19.7%，10% 的 USDT 挤兑在校准压力情景下将推高 3 个月期收益率 47–60 个
      基点。
    abstract_en: >-
      Stablecoin issuers have become structural marginal buyers of U.S. money-market
      and short-dated fixed-income assets. This paper studies how stablecoin
      issuance and redemption affect the bond market along four dimensions: the
      Treasury yield curve, volatility spillovers, credit spreads as a proxy for
      the commercial paper market, and systemic risk. Using daily data from
      2020-01 to 2026-06 covering USDT, USDC, DAI, and BUSD, FRED Treasury yields
      and money-market variables, on-chain transfer and exchange flows, and crypto
      derivatives indicators, we deploy local projections, LP-IV, vector
      autoregressions, Diebold-Yilmaz connectedness, and calibrated stress tests.
      A $1 bn five-day net issuance lowers 1M/3M Treasury yields by up to
      3.4/2.4 bps within three weeks; effects concentrate at the short end and
      stablecoin-bond connectedness averages 19.7%.
    abstract_zh: >-
      稳定币发行方已成为美国货币市场与短期固定收益资产的结构化边际买家。本文从四个
      维度研究稳定币发行与赎回对债券市场的影响：国债收益率曲线、波动溢出、信用利差
      （作为数据不可得的商业票据市场的代理）以及系统性风险。基于 2020 年 1 月至 2026 年 6
      月涵盖 USDT、USDC、DAI、BUSD、FRED 国债收益率与货币市场变量、链上转账与交易所流量
      以及加密衍生品指标的日度数据，本文综合运用局部投影、LP-IV、向量自回归、
      Diebold-Yilmaz 连通性测度与校准压力测试。10 亿美元的 5 日净发行在三周内使 1 个月/
      3 个月期国债收益率最多下行 3.4/2.4 个基点；效应集中于短端，稳定币与债市的平均连通性
      为 19.7%。
