publications:
  featured:
    badge_en: "SSRN"
    badge_zh: "SSRN"
    title: "A Systematic Bibliometric and Topic Modelling Review of Crypto Financial Risk Research"
    title_zh: "加密金融风险研究的系统文献计量与主题建模综述"
    authors: '**Jiayi Zhou**, Jingjing Li, Binbin Xu, Yanran Ma, Jianfeng Guo'
    venue_en: "SSRN Working Paper, January 31, 2026. [SSRN](https://ssrn.com/abstract=7225798) · [DOI](http://dx.doi.org/10.2139/ssrn.7225798)"
    venue_zh: "SSRN 工作论文，2026 年 1 月 31 日。[SSRN](https://ssrn.com/abstract=7225798) · [DOI](http://dx.doi.org/10.2139/ssrn.7225798)"
    points:
      - en: >-
          Conducted a systematic bibliometric review of crypto financial risk
          research, mapping its intellectual structure, keyword evolution, and
          emerging research fronts.
        zh: >-
          对加密金融风险研究进行系统文献计量综述，刻画其知识结构、关键词
          演进与新兴研究前沿。
      - en: >-
          Applied a modular BERTopic pipeline to identify core research themes
          spanning risk identification, measurement, transmission, hedging,
          and governance.
        zh: >-
          应用模块化 BERTopic 流程，识别覆盖风险识别、度量、传染、对冲与
          治理的核心研究主题。
      - en: >-
          Linked topic clusters to a hand-collected database of crypto risk
          events (2012–2025) to connect literature gaps with empirical
          reality and propose an end-to-end risk research framework.
        zh: >-
          将主题聚类与手工整理的加密风险事件数据库（2012–2025）相联系，
          弥合文献空白与经验现实之间的差距，并提出端到端的风险研究框架。
