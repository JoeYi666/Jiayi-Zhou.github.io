about:
  paragraphs:
    - en: >-
        I am a Ph.D. candidate at the Institutes of Science and Development,
        Chinese Academy of Sciences (CASISD), affiliated with the School of
        Public Policy and Management, University of Chinese Academy of Sciences
        (UCAS). My supervisor is Prof. Jian-Feng Guo.
      zh: >-
        我是中国科学院科技战略咨询研究院（CASISD）的博士研究生，
        就读于中国科学院大学公共政策与管理学院，导师为郭剑锋研究员。
    - en: >-
        My research focuses on **crypto finance and stablecoin economics**,
        spanning decentralized finance (DeFi), systemic risk and financial
        stability, international financial markets, and machine learning /
        causal inference in finance. My doctoral dissertation examines the
        impact of USD stablecoins on international financial markets through
        a multi-method empirical framework.
      zh: >-
        我的研究聚焦**加密金融与稳定币经济学**，涵盖去中心化金融（DeFi）、
        系统性风险与金融稳定、国际金融市场，以及金融中的机器学习与因果推断。
        我的博士论文通过多方法实证框架，系统考察美元稳定币对国际金融市场的影响。
    - en: >-
        A Bitcoiner at heart, I stay active in the Chinese-speaking crypto
        community and keep close track of Bitcoin and the broader digital-asset
        ecosystem.
      zh: >-
        我是一名 Bitcoiner，积极参与华语加密社区，持续关注比特币及更广泛的
        数字资产生态。

philosophy:
  cards:
    - title_en: "ISFC & the Money View"
      title_zh: "ISFC 与货币视角"
      en: >-
        I ground stablecoin research in Incremental-Stock-Flow-Consistent
        (ISFC) modeling and Perry Mehrling's Money View. Treating issuers,
        commercial banks, and shadow banks as nodes on a common balance-sheet
        network lets me trace how digital dollars are created, circulated, and
        destroyed — money as a social ledger of intertemporal obligations.
      zh: >-
        我将稳定币研究建立在增量—存量—流量一致（ISFC）框架与 Perry
        Mehrling 的货币视角（Money View）之上。把发行方、商业银行与影子银行
        视为同一张资产负债表网络上的节点，可以追踪数字美元如何被创造、流转与
        销毁——货币即跨期债务的社会记账。

    - title_en: "Causal Inference & Reproducibility"
      title_zh: "因果推断与可复现性"
      en: >-
        Causal identification comes before prediction. I combine
        difference-in-differences, instrumental variables, regression
        discontinuity, synthetic control, and double-machine-learning methods to
        isolate mechanisms. Every project ships with a variable dictionary,
        sample restrictions, robustness checks, and a replication package.
      zh: >-
        因果识别优先于预测。我综合运用双重差分、工具变量、断点回归、合成控制
        与双重机器学习等方法来隔离机制。每个项目都附带变量字典、样本限制、
        稳健性检验与复现包。

    - title_en: "First Principles"
      title_zh: "第一性原理"
      en: >-
        I reason from first principles: money is a ledger for intertemporal
        energy allocation; a balance sheet encodes a node's social relations;
        systemic risk is the fragility of the network structure that emerges
        when those relations tighten.
      zh: >-
        我从第一性原理出发：货币是跨期能量配置的记账杠杆；资产负债表编码了
        节点的社会关系；系统性风险则源于这些关系过度收紧后网络结构的脆弱性。

    - title_en: "AI-Augmented Research"
      title_zh: "AI 增强科研"
      en: >-
        Large language models and AI coding tools are infrastructure for
        research automation — literature review, data cleaning, code
        generation, and causal-inference workflows. Human judgment and
        auditable logs remain the final checkpoint.
      zh: >-
        大语言模型与 AI 编程工具是科研自动化的基础设施，服务于文献梳理、
        数据清洗、代码生成与因果推断工作流。人工判断与可审计日志始终是最终
        把关节点。

  quote:
    zh_text: "科学，就是相信专家也会无知。"
    zh_source: "理查德·费曼"
    en_text: "Science is the belief in the ignorance of experts."
    en_source: "Richard Feynman"

