about:
  paragraphs:
    - en: >-
        I am a Ph.D. candidate at the Institutes of Science and Development,
        Chinese Academy of Sciences (CASISD), affiliated with the School of
        Public Policy and Management, University of Chinese Academy of Sciences
        (UCAS). My supervisor is [Prof. Jian-Feng Guo](https://people.ucas.ac.cn/~Guojf).
      zh: >-
        我是中国科学院科技战略咨询研究院（CASISD）的博士研究生，
        就读于中国科学院大学公共政策与管理学院，
        导师为[郭剑锋研究员](https://people.ucas.ac.cn/~Guojf)。
    - en: >-
        My research focuses on **crypto finance and stablecoin economics**,
        spanning decentralized finance (DeFi), systemic risk and financial
        stability, international financial markets, and machine learning /
        causal inference in finance. My doctoral dissertation examines the
        impact of USD stablecoins on international financial markets through
        a multi-method empirical framework.
      zh: >-
        我的研究聚焦**加密金融与稳定币经济学**，涵盖去中心化金融（DeFi）、
        系统性风险与金融稳定、国际金融市场，以及金融中的机器学习与因果推断。
        我的博士论文通过多方法实证框架，系统考察美元稳定币对国际金融市场的影响。
    - en: >-
        A Bitcoiner at heart, I stay active in the Chinese-speaking crypto
        community and keep close track of Bitcoin and the broader digital-asset
        ecosystem.
      zh: >-
        我是一名 Bitcoiner，积极参与华语加密社区，持续关注比特币及更广泛的
        数字资产生态。

philosophy:
  cards:
    - title_en: "First Principles"
      title_zh: "第一性原理"
      en: >-
        I try to reason from the underlying accounting and institutional
        mechanics of money. A stablecoin is not just a price or a token; it is a
        promise recorded on a balance sheet, backed by reserves and redeemed by
        a network of counterparties. Starting from these primitives makes it
        easier to see how issuance, reserve allocation, and redemption connect
        to bond yields, exchange rates, and equity prices.
      zh: >-
        我倾向于从货币 underlying 的会计与制度机制出发思考问题。稳定币不只是
        价格或代币，而是记录在资产负债表上、由储备支撑、由交易对手网络赎回的
        一种承诺。从这些基本单元出发，发行、储备配置与赎回如何连接国债收益率、
        汇率与股价，会变得更清晰。

    - title_en: "AI-Augmented Research"
      title_zh: "AI 增强科研"
      en: >-
        I use large language models and AI coding tools as assistants for
        literature review, data cleaning, code generation, and workflow
        automation. They speed up exploration, but the design of research
        questions, identification strategies, and interpretation of results
        remains a human responsibility.
      zh: >-
        我将大语言模型与 AI 编程工具作为文献梳理、数据清洗、代码生成与工作流
        自动化的助手。它们能加快探索过程，但研究问题设计、识别策略与结果解释
        仍需要人来完成。

    - title_en: "Causal Inference, Reproducibility & Open Source"
      title_zh: "因果推断、可复现性与开源"
      en: >-
        Causal identification matters more than prediction alone. I combine
        instrumental variables, local projections, difference-in-differences,
        regression discontinuity, and machine-learning-assisted identification
        to isolate mechanisms. I also keep code, data dictionaries, and
        replication materials in public GitHub repositories so that results can
        be checked and reused.
      zh: >-
        因果识别比单纯的预测更重要。我综合运用工具变量、局部投影、双重差分、
        断点回归以及机器学习辅助的识别策略来分离机制。同时，我把代码、变量字典
        与复现材料放在公开 GitHub 仓库中，方便结果被检验与复用。

    - title_en: "ISFC & the Money View"
      title_zh: "ISFC 与货币视角"
      en: >-
        My doctoral work develops an Incremental-Stock-Flow-Consistent (ISFC)
        framework for stablecoin balance sheets, drawing on Perry Mehrling's
        Money View and post-Keynesian SFC models. The framework treats issuers,
        commercial banks, and shadow banks as nodes on a common balance-sheet
        network, and traces how digital dollars are created, allocated, and
        redeemed.
      zh: >-
        我的博士工作为稳定币资产负债表构建了一个增量—存量—流量一致（ISFC）
        框架，借鉴 Perry Mehrling 的货币视角与后凯恩斯主义 SFC 模型。该框架将
        发行方、商业银行与影子银行视为同一张资产负债表网络上的节点，追踪数字
        美元如何被创造、配置与赎回。

    - title_en: "New Economic Thinking"
      title_zh: "新的经济学思想"
      en: >-
        I am interested in strands of economic thinking that put accounting,
        energy, and complexity at the center: biophysical economics, complexity
        science, and crypto-economics. These perspectives help connect abstract
        price dynamics to physical and institutional constraints.
      zh: >-
        我对把会计、能量与复杂性置于核心的经济学思潮感兴趣，包括生物物理经济
        学、复杂性科学与加密经济学。这些视角有助于把抽象的价格动态与物质和制度
        约束联系起来。

  quote:
    zh_text: "科学，就是相信专家也会无知。"
    zh_source: "理查德·费曼"
    en_text: "Science is the belief in the ignorance of experts."
    en_source: "Richard Feynman"

